<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hemu-ski 板类资产 Workshop — 审查与滑行预览</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#7e8b99; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #c { display:block; width:100%; height:100%; }
  .bar { position:fixed; left:10px; display:flex; flex-wrap:wrap; gap:6px; max-width:72vw; z-index:5; }
  #gearbar { top:10px; }
  #viewbar { top:52px; }
  .bar button { font-size:14px; padding:7px 12px; border-radius:8px; border:1px solid #3c4652; background:#1d2530; color:#dfe7ef; cursor:pointer; }
  .bar button.on { background:#e86a1c; border-color:#e86a1c; color:#fff; }
  .bar .sep { width:10px; }
  #panel { position:fixed; right:10px; top:10px; width:238px; background:rgba(16,21,28,.9); color:#dfe7ef; border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.55; z-index:5; }
  #panel h2 { font-size:15px; margin:0 0 6px; color:#fff; }
  #panel h3 { font-size:13px; margin:10px 0 4px; color:#ffd9ae; }
  #panel .row { display:flex; align-items:center; gap:7px; margin:6px 0; }
  #panel label { cursor:pointer; user-select:none; flex:1; }
  #panel input[type=color] { width:40px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  #panel select { flex:1; font-size:13px; padding:4px; border-radius:6px; }
  #spec { white-space:pre-line; color:#aeb9c6; font-size:12.5px; border-top:1px solid #39434f; margin-top:9px; padding-top:8px; }
  #hint { position:fixed; left:10px; bottom:10px; color:#e8eef5; font-size:12.5px; text-shadow:0 1px 3px rgba(0,0,0,.5); z-index:5; }
  @media (max-width: 760px) {
    #panel { width:186px; font-size:12px; padding:9px 10px; }
    .bar button { font-size:12.5px; padding:6px 9px; }
    #stat { top:92px; }
  }
  #stat { position:fixed; left:10px; top:96px; color:#e8eef5; font-size:12.5px; text-shadow:0 1px 3px rgba(0,0,0,.5); z-index:5; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar" id="gearbar"></div>
<div class="bar" id="viewbar"></div>
<div id="stat"></div>
<div id="panel">
  <h2>款式面板</h2>
  <div class="row"><label for="ctop">板面颜色</label><input type="color" id="ctop" value="#f2f2f0"></div>
  <div class="row"><label for="cbase">板底颜色</label><input type="color" id="cbase" value="#d82f2a"></div>
  <div class="row"><label for="cpat">图案颜色</label><input type="color" id="cpat" value="#d82f2a"></div>
  <div class="row"><label for="cpat2">图案副色</label><input type="color" id="cpat2" value="#17171a"></div>
  <div class="row"><label for="cacc">固定器点缀</label><input type="color" id="cacc" value="#e86a1c"></div>
  <div class="row"><label for="pattern">花纹图案</label>
    <select id="pattern">
      <option value="none">纯色</option>
      <option value="lengthStripes">纵条纹</option>
      <option value="diagonal">斜纹</option>
      <option value="chevrons">箭头纹</option>
      <option value="split">头尾分色</option>
      <option value="blocks">格纹</option>
    </select></div>
  <h3>审查选项</h3>
  <div class="row"><input type="checkbox" id="spin" checked><label for="spin">自动旋转（360°）</label></div>
  <div class="row"><input type="checkbox" id="boot"><label for="boot">靴子占位（固定器视图）</label></div>
  <div id="straprow">
    <div class="row"><input type="checkbox" id="ankle" checked><label for="ankle">踝带 strap-ankle</label></div>
    <div class="row"><input type="checkbox" id="toe" checked><label for="toe">趾带 strap-toe</label></div>
    <div class="row"><input type="checkbox" id="detach"><label for="detach">拆开绑带（抬起分离）</label></div>
  </div>
  <div id="spec"></div>
</div>
<div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createSwallowtailBoard } from './lib/createSwallowtailBoard.js';
import { createSkis } from './lib/createSkis.js';
import { createSnowboardBinding } from './lib/createSnowboardBinding.js';
import { createSkiBinding } from './lib/createSkiBinding.js';
import { createBootLast } from './lib/createBootLast.js';
import { createRiderFigure } from './lib/createRiderFigure.js';

const VERSION = 'v20';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#7e8b99');
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotateSpeed = 2.2;

scene.add(new THREE.HemisphereLight(0xdfeaf5, 0x4a4238, 1.15));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
sun.position.set(2.5, 4, 1.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.002;
sun.shadow.camera.left = -2; sun.shadow.camera.right = 2; sun.shadow.camera.top = 2; sun.shadow.camera.bottom = -2;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(7, 48), new THREE.MeshStandardMaterial({ color: '#93a3b3', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.002; ground.receiveShadow = true;
scene.add(ground);

// speed lines for the in-place glide (ground flowing past the rider)
const lines = new THREE.Group();
{
  const lm = new THREE.MeshBasicMaterial({ color: '#e8eef5' });
  for (let i = 0; i < 26; i++) {
    const isBoardDir = i % 2 === 0;
    const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), lm);
    m.userData.seed = Math.random();
    lines.add(m);
  }
  lines.visible = false;
  scene.add(lines);
}
function layoutLines(gear) {
  lines.children.forEach((m, i) => {
    const s = m.userData.seed;
    if (gear === 'board') { // travel toward +x: lines lie along x, scattered in z
      m.scale.set(0.7 + s * 1.1, 0.004, 0.03);
      m.position.set(((s * 7 + i * 0.37) % 6) - 3, 0.002, ((s * 13 + i * 0.61) % 3.4) - 1.7);
      if (Math.abs(m.position.z) < 0.3) m.position.z += 0.55;
    } else { // skis travel toward -z: lines lie along z, scattered in x
      m.scale.set(0.03, 0.004, 0.7 + s * 1.1);
      m.position.set(((s * 11 + i * 0.53) % 3.4) - 1.7, 0.002, ((s * 5 + i * 0.41) % 6) - 3);
      if (Math.abs(m.position.x) < 0.3) m.position.x += 0.55;
    }
  });
}

const stage = new THREE.Group();
scene.add(stage);
const $ = (id) => document.getElementById(id);
const state = { gear: 'board', view: 'solo' };
let rider = null;      // active RiderFigure (wear/glide)
let carveRig = null;   // group rolled for carving in glide
let straps = [];

const boardOpts = () => ({
  topsheetColor: $('ctop').value, baseColor: $('cbase').value,
  pattern: $('pattern').value, patternColor: $('cpat').value, patternColor2: $('cpat2').value,
  basePattern: $('pattern').value === 'none' ? 'none' : 'lengthStripes', basePatternColor: $('ctop').value,
});
const skiOpts = () => ({
  topsheetColor: $('ctop').value === '#f2f2f0' ? '#2f5d8a' : $('ctop').value,
  baseColor: $('cbase').value, stripeColor: $('cpat').value, accentColor: $('cpat2').value === '#17171a' ? '#f2a7b9' : $('cpat2').value,
});
const bindOpts = () => ({ accentColor: $('cacc').value });

function collectStraps(root) {
  straps = [];
  root.traverse((n) => { if (n.userData && n.userData.detachable) straps.push({ node: n, home: n.position.clone(), name: n.name }); });
}
function applyStraps() {
  for (const s of straps) {
    const on = s.name === 'strap-ankle' ? $('ankle').checked : $('toe').checked;
    s.node.visible = on;
    const off = $('detach').checked && on;
    s.node.position.copy(s.home).add(new THREE.Vector3(0, off ? 0.13 : 0, 0));
  }
}
function countTris(obj) {
  let t = 0;
  obj.traverse((m) => { if (m.isMesh) { const g = m.geometry; t += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  return Math.round(t);
}
function frame(obj, dist = 1, dir = [1.05, 0.7, 1.3]) {
  const bb = new THREE.Box3().setFromObject(obj);
  const c = bb.getCenter(new THREE.Vector3());
  const s = bb.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z);
  controls.target.copy(c);
  camera.position.set(c.x + r * dir[0] * dist, c.y + r * dir[1], c.z + r * dir[2] * dist);
  camera.near = Math.max(0.01, r / 100); camera.far = r * 80; camera.updateProjectionMatrix();
}

const SPECS = {
  solo_board: '燕尾粉雪单板\n长 1600 · 头 330 / 腰 274 / 尾 302 mm\n面板可换色/换图案，零贴图',
  solo_skis: '全山双板（一对）\n长 1700 · 132 / 105 / 118 mm · 站距 250',
  binding_board: '单板固定器（单只）\n适配游戏靴 170×330 · 内宽 190\n踝带/趾带独立可拆（右侧开关）',
  binding_skis: '双板固定器（单只）\n适配鞋底 340 · 站高 35 · 刹车宽 145',
  wear_board: '穿戴：人物 + 单板 + 固定器\n人物为比例占位（总高约 1.80）\n站距 512 · 前 +15° / 后 −9°',
  wear_skis: '穿戴：人物 + 双板 + 固定器\n双脚平行 · 鞋头朝板头',
  glide_board: '原地滑行：单板压刃摇摆\n人物关节 + 整板滚转 + 地面速度线',
  glide_skis: '原地滑行：双板平行滑行\n膝踝弹簧 + 身体微摆 + 速度线',
};

function buildWear(glideMode) {
  const rig = new THREE.Group();
  carveRig = new THREE.Group();
  rig.add(carveRig);
  if (state.gear === 'board') {
    const board = createSwallowtailBoard(boardOpts());
    board.position.y = 0.0055;
    carveRig.add(board);
    for (const [z, ang] of [[-0.128, Math.PI / 2 + 0.18], [0.384, Math.PI / 2 - 0.10]]) {
      const b = createSnowboardBinding(bindOpts());
      b.position.set(0, 0.016, z);
      b.rotation.y = ang;
      carveRig.add(b);
    }
    rider = createRiderFigure('board');
    rider.group.rotation.y = Math.PI / 2 + 0.04;
    rider.group.position.set(0, 0.16, 0.128);
    carveRig.add(rider.group);
  } else {
    const skis = createSkis(skiOpts());
    skis.position.y = 0.006;
    carveRig.add(skis);
    for (const sx of [-1, 1]) {
      const b = createSkiBinding({ accentColor: $('cacc').value });
      b.position.set(sx * 0.125, 0.0155, 0);
      carveRig.add(b);
    }
    rider = createRiderFigure('ski');
    rider.group.rotation.y = Math.PI;
    rider.group.position.set(0, 0.05, 0.055);
    carveRig.add(rider.group);
  }
  return rig;
}

function show() {
  while (stage.children.length) stage.remove(stage.children[0]);
  rider = null; carveRig = null;
  let obj;
  const key = `${state.view}_${state.gear}`;
  if (state.view === 'solo') {
    obj = state.gear === 'board' ? createSwallowtailBoard(boardOpts()) : createSkis(skiOpts());
  } else if (state.view === 'binding') {
    if (state.gear === 'board') {
      obj = createSnowboardBinding(bindOpts());
      obj.rotation.y = -0.5;
      const boot = createBootLast('board');
      boot.rotation.y = -0.5; boot.position.y = 0.026; boot.name = 'BootStandalone';
      boot.visible = $('boot').checked;
      const wrap = new THREE.Group(); wrap.add(obj, boot); obj = wrap;
    } else {
      obj = createSkiBinding({ accentColor: $('cacc').value });
      obj.rotation.y = 0.5;
      const boot = createBootLast('ski');
      boot.rotation.y = 0.5; boot.position.y = 0.045; boot.name = 'BootStandalone';
      boot.visible = $('boot').checked;
      const wrap = new THREE.Group(); wrap.add(obj, boot); obj = wrap;
    }
  } else {
    obj = buildWear(state.view === 'glide');
  }
  stage.add(obj);
  collectStraps(obj);
  applyStraps();
  lines.visible = state.view === 'glide';
  if (lines.visible) layoutLines(state.gear);
  controls.autoRotate = $('spin').checked && state.view !== 'glide';
  $('straprow').style.display = state.gear === 'board' && state.view !== 'solo' ? 'block' : 'none';
  $('spec').textContent = SPECS[key] || '';
  $('stat').textContent = `三角面 ${countTris(obj).toLocaleString()} · 贴图 0 · Workshop ${VERSION}`;
  const wearLike = state.view === 'wear' || state.view === 'glide';
  let dir = wearLike ? (state.gear === 'board' ? [1.25, 0.6, 0.85] : [0.8, 0.6, -1.2]) : undefined;
  if (state.view === 'binding' && state.gear === 'skis') dir = [1.35, 0.5, 0.35]; // side view: toe/heel read best
  frame(obj, state.view === 'binding' ? 1.5 : 1, dir);
  document.querySelectorAll('#gearbar button').forEach((b) => b.classList.toggle('on', b.dataset.gear === state.gear));
  document.querySelectorAll('#viewbar button').forEach((b) => b.classList.toggle('on', b.dataset.view === state.view));
}

for (const [gear, label] of [['board', '单板 Snowboard'], ['skis', '双板 Skis']]) {
  const btn = document.createElement('button');
  btn.textContent = label; btn.dataset.gear = gear;
  btn.onclick = () => { state.gear = gear; onGearDefaults(); show(); };
  $('gearbar').appendChild(btn);
}
for (const [view, label] of [['solo', '单独审查 360°'], ['binding', '固定器'], ['wear', '穿戴视图'], ['glide', '原地滑行']]) {
  const btn = document.createElement('button');
  btn.textContent = label; btn.dataset.view = view;
  btn.onclick = () => { state.view = view; show(); };
  $('viewbar').appendChild(btn);
}
function onGearDefaults() {
  if (state.gear === 'skis') { if ($('ctop').value === '#f2f2f0') $('ctop').value = '#2f5d8a'; }
  else { if ($('ctop').value === '#2f5d8a') $('ctop').value = '#f2f2f0'; }
}
for (const id of ['ctop', 'cbase', 'cpat', 'cpat2', 'cacc', 'pattern']) $(id).addEventListener('input', show);
for (const id of ['ankle', 'toe', 'detach']) $(id).addEventListener('change', applyStraps);
$('spin').addEventListener('change', () => { controls.autoRotate = $('spin').checked && state.view !== 'glide'; });
$('boot').addEventListener('change', () => stage.traverse((n) => { if (n.name === 'BootStandalone') n.visible = $('boot').checked; }));

const q = new URLSearchParams(location.search);
if (q.get('gear')) state.gear = q.get('gear');
if (q.get('view')) state.view = q.get('view');
if (q.get('pattern')) $('pattern').value = q.get('pattern');
for (const id of ['ctop', 'cbase', 'cpat', 'cpat2', 'cacc']) if (q.get(id)) $(id).value = q.get(id);
if (q.get('spin') === '0') $('spin').checked = false;
if (q.get('boot') === '1') $('boot').checked = true;
if (q.get('detach') === '1') $('detach').checked = true;
show();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (state.view === 'glide' && rider) {
    rider.glide(t);
    if (carveRig) {
      if (state.gear === 'board') carveRig.rotation.z = Math.sin(t * 1.6) * 0.09;
      else { carveRig.rotation.z = Math.sin(t * 1.6) * 0.045; carveRig.position.x = Math.sin(t * 1.6) * 0.02; }
    }
    const dir = state.gear === 'board' ? 'x' : 'z';
    const sgn = state.gear === 'board' ? -1 : 1;
    for (const m of lines.children) {
      m.position[dir] += sgn * 0.028;
      if (m.position[dir] > 3.2) m.position[dir] = -3.2;
      if (m.position[dir] < -3.2) m.position[dir] = 3.2;
    }
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
